name: Check loaded form versions in real browsers
on:
  push:
    branches: ['audit/mfs-same-second']
    paths: [.github/workflows/mfs-version-browser.yml, tests/mfs-version-browser.py, tests/mfs-version-browser.cjs]

concurrency:
  group: mfs-browser-candidates
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: main
            revision: e54c41b8253192e81138f7ae1477752cf4c0fa8e
          - line: V13
            revision: 652abbdc55af873759281ac614904a753516bcb5
          - line: V14
            revision: 18f1d3efb726701a98e15468b6cfa3ee5ce14b3c
          - line: V15
            revision: 09c97a029752318ebb81af1438831f9c456fce73
          - line: V16
            revision: 030e966d9cf9cd112e79fd53a3d90ee8638125e0
          - line: V17
            revision: 15f59ff3c79d4b4da0827422b694c70f73f1797e
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      U5CMS_TEST_PORT: '3306'
      U5CMS_TEST_DB: test
      U5CMS_TEST_USER: root
      U5CMS_TEST_PASSWORD: ''
      U5_TEST_PHP: php
      U5CMS_RENAME_AUDIT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, intl, iconv, ctype, curl, gd, zip, fileinfo, dom
          coverage: none
          ini-values: memory_limit=512M, date.timezone=Europe/Zurich, sendmail_path=/bin/false, opcache.enable_cli=0
      - name: Install the isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/u5-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          # Ubuntu 24.04 runners already supply the browser OS libraries.
          # Install the pinned browsers for the login and backend checks.
          node "$RUNNER_TEMP/u5-browser/node_modules/playwright/cli.js" install chromium firefox
          echo "U5_TEST_PLAYWRIGHT=$RUNNER_TEMP/u5-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Measure the rendered search destination
        env:
          U5_AUDIT_LINE: ${{ matrix.line }}
          U5_AUDIT_REVISION: ${{ matrix.revision }}
        run: |
          mkdir "$RUNNER_TEMP/application"
          git archive "$U5_AUDIT_REVISION" | tar -x -C "$RUNNER_TEMP/application"
          export U5_AUDIT_APPLICATION="$RUNNER_TEMP/application"
          status=0
          for engine in chromium firefox; do
            U5_TEST_ENGINE="$engine" python3 tests/mfs-version-browser.py || status=1
          done
          exit "$status"
