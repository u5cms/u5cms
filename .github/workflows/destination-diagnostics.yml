name: Observe server diagnostics for saved search links
on:
  push:
    branches: ['audit/distribution-parity-1294']
    paths: [.github/workflows/destination-diagnostics.yml, tests/destination-diagnostics.py]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: origin
            revision: 9d366253417822c279692767b89dcf1ff0388c5c
          - line: previous
            revision: dccf010f5e0bbbdbf20f6af75d4194e20ed7e224
          - line: main
            revision: a1cee139c3b101852b7ebe4d35d48324b468aeb9
          - line: V13
            revision: 6cc2177808dcbaa480317c57ded1b777f3c04aa6
          - line: V14
            revision: ae63acd47f01fec1e18e99ea4e7652633de196b6
          - line: V15
            revision: 3a843d4535a738ec61b361bf60f53ca06080399c
          - line: V16
            revision: 32bc60cbbc459e3058998162b0850fee6ca01b72
          - line: V17
            revision: 6d17fc76111a63476fdc6f411f24fe576b41e649
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      U5CMS_TEST_PORT: '3306'
      U5CMS_TEST_DB: test
      U5CMS_TEST_USER: root
      U5CMS_TEST_PASSWORD: ''
      U5_TEST_PHP: php
      U5CMS_RENAME_AUDIT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, intl, iconv, ctype, curl, gd, zip, fileinfo, dom
          coverage: none
          ini-values: memory_limit=512M, date.timezone=Europe/Zurich, sendmail_path=/bin/false, opcache.enable_cli=0
      - name: Inspect HTTP destination rendering and PHP diagnostics
        env:
          U5_AUDIT_REVISION: ${{ matrix.revision }}
        run: |
          mkdir "$RUNNER_TEMP/application"
          git archive "$U5_AUDIT_REVISION" | tar -x -C "$RUNNER_TEMP/application"
          export U5_AUDIT_APPLICATION="$RUNNER_TEMP/application"
          python3 tests/destination-diagnostics.py
