name: Search destination viewport evolution
on:
  push:
    branches: ['audit/search-viewport-evolution']

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: origin
            revision: 9d366253417822c279692767b89dcf1ff0388c5c
          - line: previous
            revision: 7a6df576d677e6666776f3ec4d809f98808fb05a
          - line: main
            revision: dccf010f5e0bbbdbf20f6af75d4194e20ed7e224
          - line: V13
            revision: 183be185bd557b10d6b2f33a8a5af21549dd32c6
          - line: V14
            revision: 6e788495375a68a5b649e8bb5aa16d4bef9b00c5
          - line: V15
            revision: 358a7e2399987327aee3b71f3624dfd5e9fe3deb
          - line: V16
            revision: 74e22a29b29ca185cb9dcbeb77418427de7f59eb
          - line: V17
            revision: 4b4ec0d81218ed5e29584163fa362a2f7c5297f2
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      U5CMS_TEST_PORT: '3306'
      U5CMS_TEST_DB: test
      U5CMS_TEST_USER: root
      U5CMS_TEST_PASSWORD: ''
      U5_TEST_PHP: php
      U5CMS_RENAME_AUDIT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, intl, iconv, ctype, curl, gd, zip, fileinfo, dom
          coverage: none
          ini-values: memory_limit=512M, date.timezone=Europe/Zurich, sendmail_path=/bin/false, opcache.enable_cli=0
      - name: Install the isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/u5-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          # Ubuntu 24.04 runners already supply the browser OS libraries.
          # Install the pinned browsers for the login and backend checks.
          node "$RUNNER_TEMP/u5-browser/node_modules/playwright/cli.js" install chromium firefox
          echo "U5_TEST_PLAYWRIGHT=$RUNNER_TEMP/u5-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Measure the rendered search destination
        env:
          U5_AUDIT_REVISION: ${{ matrix.revision }}
        run: |
          mkdir "$RUNNER_TEMP/application"
          git archive "$U5_AUDIT_REVISION" | tar -x -C "$RUNNER_TEMP/application"
          export U5_AUDIT_APPLICATION="$RUNNER_TEMP/application"
          status=0
          for engine in chromium firefox; do
            U5_TEST_ENGINE="$engine" python3 tests/search-viewport-audit.py || status=1
          done
          exit "$status"
