name: u5CMS stable release acceptance

on:
  push:
    branches: ['main', '12.9.5.4-Indexer-Final', '12.9.5.7-Nonblocking-Saves', 'V17-New-Responsive-Layouts']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: u5-stable-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      U5CMS_TEST_PORT: '3306'
      U5CMS_TEST_DB: test
      U5CMS_TEST_USER: root
      U5CMS_TEST_PASSWORD: ''
      U5_TEST_PHP: php
      U5CMS_RENAME_AUDIT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring, intl, iconv, ctype, curl, gd, zip, fileinfo, dom
          coverage: none
          ini-values: memory_limit=512M, date.timezone=Europe/Zurich, sendmail_path=/bin/false, opcache.enable_cli=0
      - name: PHP, search, ownership, Rename and mail contracts
        run: |
          set -e
          for test in background-work-regression indexer-batch-regression index-update-notice search-legacy-memory-regression search-core-regression search-service-regression search-suggestions-regression search-index-regression onlymine-domain rename-regression international-email login-host-regression trusted-device-regression trusted-device-database-regression trusted-device-rollout-regression; do
            php "tests/$test.php"
          done
          php tests/metadata-language-links-regression.php
          php tests/documentation-ownership.php
          node tests/background-runner-regression.cjs
          python3 tests/indexer-crash-regression.py
          python3 tests/indexer-database-lock-regression.py
          python3 tests/indexer-http-regression.py
          python3 tests/provision-regression.py
          python3 tests/provision-http.py
          python3 tests/index-save-regression.py
          python3 tests/resource-activity-regression.py
          python3 tests/rename-packet-regression.py
          python3 tests/backup-write-regression.py
          U5CMS_INDEX_SOURCE_ROOT="$PWD" U5_AUDIT_EXPECT_HTTP=200 python3 tests/audit-save-during-index.py
          U5CMS_INDEX_SOURCE_ROOT="$PWD" U5_AUDIT_EXPECT_HTTP=200 U5_AUDIT_INDEX_HOOK='$row_ii = mysql_fetch_assoc($u5Result);' python3 tests/audit-save-during-index.py
          python3 tests/form-evidence-regression.py
          python3 tests/form-version-http-regression.py
          python3 tests/runonce-update-regression.py
          python3 tests/formdata-csv-regression.py
          python3 tests/international-email-smtp.py
          python3 tests/international-email-native.py
          mkdir "$RUNNER_TEMP/u5-baseline"
          git archive v12.9.5 | tar -x -C "$RUNNER_TEMP/u5-baseline"
          python3 tests/international-email-parity.py "$RUNNER_TEMP/u5-baseline"
          U5CMS_RENAME_HTTP_ONLY=1 python3 tests/rename-web-regression.py
      - name: Install the isolated browser test dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/u5-browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          # Ubuntu 24.04 runners already supply the browser OS libraries.
          # Install the pinned browsers for the login and backend checks.
          node "$RUNNER_TEMP/u5-browser/node_modules/playwright/cli.js" install chromium firefox
          echo "U5_TEST_PLAYWRIGHT=$RUNNER_TEMP/u5-browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Browser login, backend and recovery
        run: |
          U5_AUDIT_APPLICATION="$PWD" U5_AUDIT_REVISION="$GITHUB_SHA" python3 tests/prefill-readiness.py
          U5_PREFILL_TEMPLATE_NO_HEAD_CLOSE=1 U5_AUDIT_APPLICATION="$PWD" U5_AUDIT_REVISION="$GITHUB_SHA" python3 tests/prefill-readiness.py
          U5_AUDIT_APPLICATION="$PWD" U5_AUDIT_REVISION="$GITHUB_SHA" python3 tests/mf-prefill-readiness.py
          python3 tests/documentation-walkthrough.py
          U5_TEST_ENGINE=firefox python3 tests/documentation-walkthrough.py
          node tests/background-browser.cjs
          python3 tests/rename-web-regression.py
