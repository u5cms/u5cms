name: Isolated prefill readiness diagnosis
on:
  push:
    branches: ['audit/prefill-readiness-20261128']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prefill:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: origin
            sha: 9d366253417822c279692767b89dcf1ff0388c5c
          - name: predecessor
            sha: 0af39943e39f25b8ff3594675b2134801e5ee7ea
          - name: stable
            sha: 94455fc63b63097eb40908dd1d2cafb4c4f5902c
          - name: V13
            sha: 25525b6d533b77596f54652259d21d82c763c1f6
          - name: V14
            sha: 350ab3e98f103b871a37ae9d726a3c76e6de2b64
          - name: V15
            sha: dfc06825af3d77703729c42b53240307daf46150
          - name: V16
            sha: f35a13928e5de672a5cebd3cbc657d9083654ecd
          - name: V17
            sha: 159bce1d80287f70948e8a42293dfc216f01c3ca
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      U5CMS_TEST_PORT: '3306'
      U5CMS_TEST_USER: root
      U5CMS_TEST_PASSWORD: ''
      U5_AUDIT_REVISION: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, intl, iconv, ctype, curl, gd, zip, fileinfo, dom
          coverage: none
          ini-values: memory_limit=512M, date.timezone=Europe/Zurich, sendmail_path=/bin/false, opcache.enable_cli=0
      - name: Prepare pinned application and browsers
        run: |
          mkdir "$RUNNER_TEMP/application"
          git archive "${{ matrix.sha }}" | tar -x -C "$RUNNER_TEMP/application"
          echo "U5_AUDIT_APPLICATION=$RUNNER_TEMP/application" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/browser" --ignore-scripts --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/browser/node_modules/playwright/cli.js" install chromium firefox
          echo "U5_TEST_PLAYWRIGHT=$RUNNER_TEMP/browser/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Observe loaded, paused and aborted real prefill requests
        run: python3 tests/prefill-readiness.py
