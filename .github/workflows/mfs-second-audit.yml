name: Observe shared saves within one second
on:
  push:
    branches: ['audit/mfs-same-second']
    paths: [.github/workflows/mfs-second-audit.yml, tests/mfs-second-audit.py]

concurrency:
  group: mfs-http-candidates
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: main
            revision: 85bcb1cbcf07bda40d66f905bd834382bf952327
          - line: V13
            revision: a2334055d52ed8e67b44ad458e02eaf2a258351d
          - line: V14
            revision: 9af07148e63ef7943df865456849d60df196cad1
          - line: V15
            revision: 7cfd2ec7e7da523a080b2bd3302b0ad9f4de84a8
          - line: V16
            revision: 5e64b42b30cdec3bf1142935ad6673024fe6895c
          - line: V17
            revision: 1e2af232c2c90a815baafc9572d1eeccae86fee4
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      U5CMS_TEST_PORT: '3306'
      U5CMS_TEST_DB: test
      U5CMS_TEST_USER: root
      U5CMS_TEST_PASSWORD: ''
      U5_TEST_PHP: php
      U5CMS_RENAME_AUDIT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, intl, iconv, ctype, curl, gd, zip, fileinfo, dom
          coverage: none
          ini-values: memory_limit=512M, date.timezone=Europe/Zurich, sendmail_path=/bin/false, opcache.enable_cli=0
      - name: Submit the shipped shared form twice within one second
        env:
          U5_AUDIT_LINE: ${{ matrix.line }}
          U5_AUDIT_REVISION: ${{ matrix.revision }}
        run: |
          mkdir "$RUNNER_TEMP/application"
          git archive "$U5_AUDIT_REVISION" | tar -x -C "$RUNNER_TEMP/application"
          export U5_AUDIT_APPLICATION="$RUNNER_TEMP/application"
          python3 tests/mfs-second-audit.py
