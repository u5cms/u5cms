name: Observe shared saves within one second
on:
  push:
    branches: ['audit/mfs-same-second']
    paths: [.github/workflows/mfs-second-audit.yml, tests/mfs-second-audit.py]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: main
            revision: a7f818b1a8981c4743b7d94432e25df89390c4d6
          - line: V13
            revision: de577e164d679d7c60b8ff1638061ee8680dba6c
          - line: V14
            revision: 5ea80c8666ce777130f51c8a730c0ab54c36b843
          - line: V15
            revision: 44789046068d771efca92ab631099b8447eb65ac
          - line: V16
            revision: 5f33e3bb3dfdcba2c81d650ecb3318cc5c866bfe
          - line: V17
            revision: 049427449a6b64d42995480e9c6a1f7b1efa0e47
    services:
      database:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_ROOT_HOST: '%'
          MARIADB_DATABASE: test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      U5CMS_TEST_PORT: '3306'
      U5CMS_TEST_DB: test
      U5CMS_TEST_USER: root
      U5CMS_TEST_PASSWORD: ''
      U5_TEST_PHP: php
      U5CMS_RENAME_AUDIT: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@fcafdd6392932010c2bd5094439b8e33be2a8a09 # 2.37.0
        with:
          php-version: '8.4'
          extensions: mysqli, mbstring, intl, iconv, ctype, curl, gd, zip, fileinfo, dom
          coverage: none
          ini-values: memory_limit=512M, date.timezone=Europe/Zurich, sendmail_path=/bin/false, opcache.enable_cli=0
      - name: Submit the shipped shared form twice within one second
        env:
          U5_AUDIT_LINE: ${{ matrix.line }}
          U5_AUDIT_REVISION: ${{ matrix.revision }}
        run: |
          mkdir "$RUNNER_TEMP/application"
          git archive "$U5_AUDIT_REVISION" | tar -x -C "$RUNNER_TEMP/application"
          export U5_AUDIT_APPLICATION="$RUNNER_TEMP/application"
          python3 tests/mfs-second-audit.py
